name: Check Codex review clearance
run-name: >-
  ${{ inputs.reviewed_sha != '' &&
      format('Reviewed CI / PR #{0} / {1}', inputs.pr_number, inputs.reviewed_sha) ||
      format('Review clearance / PR #{0}', github.event.issue.number || inputs.pr_number) }}

on:
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR whose completed review should be checked again'
        required: true
        type: string
      reviewed_sha:
        description: 'Execution input; leave empty to request clearance of the current head'
        required: false
        type: string
      dispatch_mode:
        description: 'Execution policy; all direct requests still require live admission'
        required: false
        default: retry-failed
        type: choice
        options: [once, retry-failed]

concurrency:
  group: >-
    ${{ inputs.reviewed_sha != '' && format('reviewed-ci-{0}', inputs.pr_number) ||
        format('review-clearance-{0}', github.event.issue.number || inputs.pr_number) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  clearance:
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: write
    outputs:
      sha: ${{ steps.admission.outputs.sha }}
    name: Check Codex sign-off and unresolved items
    # This condition is evaluated before allocating a runner. Human comments and
    # running-review updates do not start a job. A completed review may have findings;
    # the API preflight below distinguishes it from a clean sign-off.
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request &&
       github.event.comment.user.id == 199175422 &&
       github.event.comment.user.type == 'Bot' &&
       github.event.comment.user.login == 'chatgpt-codex-connector[bot]' &&
       startsWith(github.event.comment.body, '<!-- codex-pull-request-review-summary -->') &&
       contains(github.event.comment.body, '✅ **Completed**') &&
       !contains(github.event.comment.body, '**Running**')))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # issue_comment runs from the default branch; never execute PR code with
      # the Actions write permission used to request the controller execution phase.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check live review state and request or admit reviewed CI
        id: admission
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number || inputs.pr_number }}
          TRIGGER_EVENT: ${{ github.event_name }}
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          DISPATCH_MODE: ${{ inputs.dispatch_mode }}
        run: |
          if [ -n "$REVIEWED_SHA" ]; then
            if [ "$TRIGGER_EVENT" != "workflow_dispatch" ]; then exit 1; fi
            case "$DISPATCH_MODE" in
              once) mode=--once ;;
              retry-failed) mode=--retry-failed ;;
              *) echo "Unsupported admission mode" >&2; exit 1 ;;
            esac
            python3 .github/scripts/review_gate.py \
              --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" \
              --expected-sha "$REVIEWED_SHA" --admit-run "$mode"
          else
            case "$TRIGGER_EVENT" in
              issue_comment) mode=--once ;;
              workflow_dispatch) mode=--retry-failed ;;
              *) echo "Unsupported clearance event" >&2; exit 1 ;;
            esac
            python3 .github/scripts/review_gate.py \
              --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" \
              --dispatch "$mode" --wait-for-signoff
          fi

  review-clearance:
    name: Verify reviewed commit
    needs: clearance
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.reviewed_sha != '' &&
      needs.clearance.result == 'success' && needs.clearance.outputs.sha == inputs.reviewed_sha &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
      issues: read
      statuses: write
    outputs:
      sha: ${{ steps.clearance.outputs.sha }}
    steps:
      # Use the same trusted revision as the workflow, never a script from the PR.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify clearance has not changed since dispatch
        id: clearance
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        run: >-
          python3 .github/scripts/review_gate.py
          --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER"
          --expected-sha "$REVIEWED_SHA"
      - name: Mark the reviewed commit's CI pending
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        env:
          REVIEWED_SHA: ${{ steps.clearance.outputs.sha }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: process.env.REVIEWED_SHA,
              context: 'Reviewed CI',
              state: 'pending',
              description: 'Testing the reviewed commit with the trusted workflow',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

  test:
    name: EBR tests (Node and PowerShell)
    needs: review-clearance
    if: ${{ !cancelled() && needs.review-clearance.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # A job-level rerun skip would report success without running the tests.
      - name: Reject native reruns
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          CI_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ "$CI_RUN_ATTEMPT" != "1" ]; then
            echo "::error::Native reruns are blocked. Request fresh clearance through review-clearance.yml."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.review-clearance.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install locked Node dependencies
        run: npm ci
      - name: Test review gate and workflow permissions
        run: |
          python3 -m pip install -r .github/review-gate-requirements.txt
          python3 -m unittest discover -s tests/ci -v
      - name: Run Node report tests
        run: node --test tests/*.test.cjs
      - name: Require PowerShell and Node; install Pester
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion.Major -lt 7) { throw 'PowerShell 7 is required.' }
          Get-Command node -ErrorAction Stop | Out-Null
          Install-PSResource -Name Pester -Version 5.9.1 -Repository PSGallery -Scope CurrentUser -TrustRepository -AcceptLicense -ErrorAction Stop
      - name: Run all Pester tests
        shell: pwsh
        run: |
          Get-Command node -ErrorAction Stop | Out-Null
          Import-Module Pester -RequiredVersion 5.9.1 -ErrorAction Stop
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.PassThru = $true
          $config.Output.Verbosity = 'Detailed'
          $result = Invoke-Pester -Configuration $config
          if ($result.TotalCount -eq 0 -or $result.Result -ne 'Passed' -or $result.SkippedCount -gt 0 -or $result.NotRunCount -gt 0) {
            throw "Pester: $($result.PassedCount) passed, $($result.FailedCount) failed, $($result.SkippedCount) skipped, $($result.NotRunCount) not run."
          }

  report-reviewed-ci:
    name: Report CI on the reviewed commit
    needs: [review-clearance, test]
    if: >-
      ${{ always() && github.event_name == 'workflow_dispatch' &&
          needs.review-clearance.outputs.sha != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      statuses: write
    steps:
      # This job never checks out or executes PR code with its write token.
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        env:
          REVIEWED_SHA: ${{ needs.review-clearance.outputs.sha }}
          CLEARANCE_RESULT: ${{ needs.review-clearance.result }}
          TEST_RESULT: ${{ needs.test.result }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          script: |
            const passed = process.env.RUN_ATTEMPT === '1' && process.env.CLEARANCE_RESULT === 'success' && process.env.TEST_RESULT === 'success';
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: process.env.REVIEWED_SHA,
              context: 'Reviewed CI',
              state: passed ? 'success' : 'failure',
              description: passed ? 'All checks passed on the reviewed commit' : 'CI failed, was cancelled, or did not complete',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
