<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>The controls that matter</title>
<style>__CSS__</style>
<style>
/* Standards edition. The report styles above, plus the pieces the client report does not need. */
.mark-f { background:var(--blue); } .mark-d { background:var(--navy); }
.standard-row { grid-template-columns:34px minmax(0,1fr); }
.standard-row .mark { width:auto; min-width:30px; padding:0 4px; font-size:11px; }
@media print, (min-width:481px) { .count-table thead th { white-space:nowrap; } }
.pillar { break-inside:avoid; }
.count-table { width:100%; border-collapse:collapse; font-size:13px; margin-top:6px; }
.count-table th, .count-table td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); }
.count-table td { text-align:right; font-weight:700; color:var(--navy); }
.count-table thead th { font-size:11px; text-transform:uppercase; letter-spacing:1.2px; color:var(--blue); }
.count-table thead th + th { text-align:right; }
.count-table tfoot th, .count-table tfoot td { border-bottom:none; border-top:2px solid var(--navy); }
.two-up { display:grid; grid-template-columns:1fr 1fr; gap:28px; margin-top:22px; }
.two-up h3, .pillar-counts h3 { font-size:15px; color:var(--navy); }
.pillar-counts { max-width:640px; margin-top:22px; }
.two-up p { font-size:13px; color:var(--muted); }
.criteria { margin:6px 0 0; padding-left:20px; font-size:13px; color:var(--muted); }
@media screen and (max-width:900px) {
  .two-up { grid-template-columns:1fr; }
}
@media screen and (max-width:480px) {
  .standard-row { grid-template-columns:34px 1fr; }
}
@media print {
  .count-table, .two-up p, .criteria { font-size:9px; }
  .count-table th, .count-table td { padding:4px 8px; }
  .count-table thead th { font-size:8px; }
  .two-up { gap:18px; margin-top:12px; }
  .two-up h3, .pillar-counts h3 { font-size:11px; }
  .pillar-counts { margin-top:12px; }
  .legend-box { padding:10px 14px; margin-bottom:10px; }
  .legend-box p + h3 { margin-top:8px; }
  .pillar { grid-template-columns:1fr; }
  .pillar-head { display:flex; align-items:baseline; gap:10px; padding:0 0 6px; }
  .pillar-head h3 { margin-top:0; }
  .pillar-head .small { margin:0; }
  .standard-row { grid-template-columns:26px minmax(0,1fr); }
  .standard-row .mark { min-width:22px; height:18px; font-size:9px; }
  .standard-row { padding:3px 0; }
  .pillar { padding:6px 0; }
  .decision-note { margin-top:10px; padding:10px 14px; break-inside:avoid; }
  .decision-note h3 { font-size:11px; }
  .decision-note p { font-size:9px; margin-top:4px; }
}
</style>
</head>
<body>

  <a class="wordmark" href="#report">atmosera<span>.</span></a>

</nav>
